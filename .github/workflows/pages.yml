name: Publicar Fluxo UPA no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          node --check site/arrhythmia-flow.js
          node --check site/arrhythmia-ecg.js
          node scripts/test-arrhythmia.cjs
          node --check site/app.js
          node --check site/catalog.js
          node --check site/animal-flow.js
          node --check site/animal-photos.js
          node scripts/test-animal-flow.cjs
          node scripts/test-animal-photos.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
