name: Publicar ANDREA no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          node --check site/arrhythmia-flow.js
          node --check site/arrhythmia-ecg.js
          node scripts/test-arrhythmia.cjs
          node --check site/app.js
          node scripts/test-frontend-navigation.cjs
          node --check site/psi-bleeding-focus.js
          node scripts/test-psi-bleeding-focus.cjs
          node scripts/test-heart-calculator.cjs
          node --check site/score-calculators.js
          node scripts/test-score-calculators.cjs
          node --check site/psychiatric-flow.js
          node --check site/hiv-tb-flow.js
          node --check site/clinical-flow-review.js
          node --check site/digestive-bleeding-flow.js
          node --check site/sepsis-flow.js
          node --check site/obstetric-flow.js
          node scripts/test-reconstructed-flows.cjs
          node scripts/test-review-batch-01.cjs
          node --check site/review-batch-02.js
          node scripts/test-review-batch-02.cjs
          node --check site/review-batch-03.js
          node scripts/test-review-batch-03.cjs
          node --check site/review-batch-04.js
          node scripts/test-review-batch-04.cjs
          node --check site/review-batch-05.js
          node scripts/test-review-batch-05.cjs
          node scripts/test-review-batch-06.cjs
          node --check site/review-batch-07.js
          node scripts/test-review-batch-07.cjs
          node --check site/review-batch-08.js
          node scripts/test-review-batch-08.cjs
          node --check site/review-batch-09.js
          node scripts/test-review-batch-09.cjs
          node --check site/review-batch-10.js
          node scripts/test-review-batch-10.cjs
          node --check site/review-batch-11.js
          node scripts/test-review-batch-11.cjs
          node --check site/review-batch-12.js
          node scripts/test-review-batch-12.cjs
          node --check site/coronary-pain-review.js
          node scripts/test-coronary-pain-review.cjs
          node --check site/catalog.js
          node --check site/animal-flow.js
          node --check site/animal-photos.js
          node scripts/test-animal-flow.cjs
          node scripts/test-animal-photos.cjs
      - name: Identificar versão publicada
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('site/version.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'publishedAt': datetime.now(timezone.utc).isoformat()}))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
